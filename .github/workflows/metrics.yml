name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # WICHTIG: @master statt @latest nutzen!
      - uses: lowighter/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Exoshiva
          filename: github-metrics.svg
          
          # 1. DARK MODE THEME FESTLEGEN (Verhindert den weißen Hintergrund)
          # Optionen: github-dark, tokyonight, terminal, nord, cobalt
          config_theme: github-dark
          config_timezone: Europe/Berlin
          
          # 2. Basis-Layout & Header
          base: header, activity, community, repositories
          
          # 3. Sprachen-Übersicht (Filtert Skripte/Packages raus)
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, shell, batch, powershell
          plugin_languages_limit: 8
          plugin_languages_details: percentage, bytes-size
          
          # 4. Commit-Gewohnheiten & Aktivitäts-Diagramm
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # 5. Klassischer Contribution-Kalender (Aktivität über Zeit im Dark Mode)
          plugin_calendar: yes
          plugin_calendar_limit: 1
