name: GitHub Metrics

on:
  # Täglich um Midnight UTC automatisch aktualisieren
  schedule:
    - cron: "0 0 * * *"
  # Erlaubt das manuelle Ausführen im "Actions"-Tab
  workflow_dispatch:
  # Aktualisiert auch bei jedem Push im Main-Branch
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Exoshiva
          filename: github-metrics.svg
          
          # Basis-Layout & Elemente
          base: header, activity, community, repositories
          config_timezone: Europe/Berlin
          
          # 1. Isometrischer Jahres-Kalender (Aktivität über Zeit)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # 2. Zeilen/Code-Statistiken über die Zeit
          plugin_lines: yes
          
          # 3. Commit-Gewohnheiten / Zeiten
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # 4. Sprachen-Anzeige (Filtert externe Package-Dateien heraus)
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, shell, batch, powershell
          plugin_languages_limit: 8
          plugin_languages_details: percentage
